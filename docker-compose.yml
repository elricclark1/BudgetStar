version: '3.8'

services:
  backend:
    container_name: budgetstar-backend
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/budgetstar.db
    volumes:
      - budgetstar_data:/app/data
    restart: unless-stopped

  frontend:
    container_name: budgetstar-frontend
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  budgetstar_data:
